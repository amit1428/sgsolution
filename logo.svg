<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="100%" height="100%">
  <defs>
    <style>
      .emerald-fill { fill: #0d6e50; }
      .gold-fill { fill: #be9238; }
      .logo-title { font-family: 'Manrope', 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 38px; fill: #0d6e50; letter-spacing: 2px; }
      .logo-tagline { font-family: 'Manrope', 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 15.5px; fill: #be9238; letter-spacing: 3.2px; }
    </style>
  </defs>

  <!-- SG Icon Mark -->
  <g transform="translate(110, 0)">
    <!-- Letter S (Emerald) -->
    <path class="emerald-fill" d="M42 22 C30 22 20 28 14 36 C8 44 6 54 8 64 C10 76 20 84 32 88 L52 94 C60 97 64 101 63 107 C62 113 56 118 46 118 C34 118 24 111 18 100 L0 110 C8 126 24 136 46 136 C60 136 72 131 79 122 C86 113 88 101 86 89 C84 76 72 68 58 64 L40 58 C32 55 28 51 29 46 C30 40 37 36 46 36 C55 36 63 41 68 50 L84 40 C76 28 62 22 42 22 Z" />

    <!-- Letter G (Gold) with Growth Chart -->
    <path class="gold-fill" d="M142 22 C110 22 86 44 84 78 C82 114 104 136 140 136 C162 136 180 126 190 110 L190 76 L140 76 L140 92 L172 92 C168 106 156 118 138 118 C116 118 104 102 104 78 C104 54 118 38 140 38 C156 38 168 46 174 58 L190 48 C180 32 164 22 142 22 Z" />

    <!-- G Inner Bar Chart Bars (Gold) -->
    <rect class="gold-fill" x="122" y="80" width="14" height="28" rx="2" />
    <rect class="gold-fill" x="142" y="66" width="14" height="42" rx="2" />

    <!-- Dynamic Emerald Growth Arrow -->
    <path class="emerald-fill" d="M102 88 Q140 60 182 30 L176 22 L206 18 L200 48 L194 40 Q152 70 110 98 Z" />
  </g>

  <!-- Horizontal Divider -->
  <line x1="20" y1="148" x2="400" y2="148" stroke="#be9238" stroke-width="1.2" opacity="0.85" />

  <!-- Typography Text -->
  <text x="210" y="136" text-anchor="middle" class="logo-title">SG SOLUTIONS</text>
  <text x="210" y="168" text-anchor="middle" class="logo-tagline">SPARK GROWTH IN A CLICK</text>
</svg>
